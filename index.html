<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位錯題本助理</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { background-color: var(--card-bg); width: 100%; max-width: 480px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 24px; color: var(--primary-color); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .file-upload-wrapper { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 30px 20px; text-align: center; background-color: #f8fafc; cursor: pointer; }
        .file-upload-wrapper input[type="file"] { display: none; }
        .submit-btn { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:disabled { background-color: #a0aec0; }
        #statusMessage { margin-top: 20px; text-align: center; font-weight: bold; font-size: 0.95rem; white-space: pre-line; line-height: 1.5; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="app-container">
    <h2>數位錯題本 - 上傳新題</h2>
    <form id="mistakeForm">
        <div class="form-group">
            <label>科目</label>
            <select id="subjectSelect" required>
                <option value="" disabled selected>請選擇科目</option>
                <option value="math">數學</option>
                <option value="physics">物理</option>
                <option value="chemistry">化學</option>
            </select>
        </div>
        <div class="form-group">
            <label>主題 / 章節</label>
            <input type="text" id="topicInput" placeholder="例如：一元二次方程式" required>
        </div>
        <div class="form-group">
            <label>錯題照片</label>
            <div class="file-upload-wrapper" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/jpeg, image/png" required>
                <span id="fileNameDisplay">點擊開啟相機或相簿 (支援 JPG, PNG)</span>
            </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">上傳並處理</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    // 1. 資安防禦：XSS 過濾
    function sanitizeHTML(str) {
        return str.replace(/[^\w. \u4e00-\u9fa5]/gi, function (c) {
            return '&#' + c.charCodeAt(0) + ';';
        });
    }

    // 2. 核心效能：前端圖片壓縮 (Canvas)
    async function compressImage(file, maxWidth = 1500, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        if (!blob) return reject(new Error('壓縮失敗'));
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    }, 'image/jpeg', quality);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // UI 互動：顯示選擇的檔案名稱
    document.getElementById('fileInput').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            document.getElementById('fileNameDisplay').textContent = `已選擇：${e.target.files[0].name}`;
        }
    });

    // 3. 表單送出與處理流程
    document.getElementById('mistakeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const file = document.getElementById('fileInput').files[0];
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');

        if (!file) { statusMsg.textContent = '請上傳照片！'; return; }
        if (file.size > 10 * 1024 * 1024) { statusMsg.textContent = '原圖不能超過 10MB！'; return; }

        submitBtn.disabled = true;
        
        try {
            // 步驟 A：前端壓縮
            statusMsg.textContent = '🔄 步驟 1/3：正在壓縮圖片...';
            const compressedFile = await compressImage(file);
            
            // 計算壓縮成效
            const originalSize = (file.size / 1024 / 1024).toFixed(2);
            const newSize = (compressedFile.size / 1024 / 1024).toFixed(2);
            const logMsg = `✅ 壓縮完成！\n原圖：${originalSize} MB ➡️ 壓縮後：${newSize} MB`;
            statusMsg.textContent = logMsg + '\n🔄 步驟 2/3：準備上傳至伺服器... (模擬)';

            // 模擬網路延遲
            await new Promise(r => setTimeout(r, 1500));
            
            // 步驟 B：模擬後端處理
            statusMsg.textContent = logMsg + '\n🔄 步驟 3/3：Mathpix 辨識與寫入資料庫... (模擬)';
            await new Promise(r => setTimeout(r, 1500));

            // 成功結算
            statusMsg.textContent = logMsg + '\n🎉 成功！已寫入錯題本。';
            statusMsg.style.color = '#2ECC71';
            
        } catch (error) {
            statusMsg.textContent = `❌ 發生錯誤：${error.message}`;
            statusMsg.style.color = '#E74C3C';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
