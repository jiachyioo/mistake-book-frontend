<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位錯題本儀表板</title>
    <style>
        :root {
            --primary-blue: #4A90E2;
            --light-blue: #DCE8F6;
            --bg-color: #F4F7FB;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; justify-content: center; }
        
        .dashboard-container { max-width: 800px; width: 100%; }
        
        /* 頂部資訊列 */
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .header-left h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header-left p { color: var(--text-muted); font-size: 0.9rem; }
        .header-stats { display: flex; gap: 20px; text-align: center; }
        .stat-item p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-item h3 { font-size: 1.2rem; }

        /* 主工作區卡片 */
        .main-card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* 拖曳上傳區 */
        .upload-area { border: 2px dashed #CBD5E1; border-radius: 12px; width: 100%; max-width: 500px; padding: 60px 20px; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary-blue); background-color: #F8FAFC; }
        .upload-icon { font-size: 3rem; color: var(--primary-blue); margin-bottom: 15px; }
        .upload-area input[type="file"] { display: none; }
        
        .action-btn { background-color: var(--light-blue); color: var(--primary-blue); border: none; padding: 12px 30px; border-radius: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background-color: var(--primary-blue); color: white; }

        /* 底部導覽列 */
        .nav-controls { background: transparent; display: flex; flex-direction: column; gap: 15px; }
        .nav-row { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .nav-label { font-weight: bold; width: 80px; }
        
        .tab-btn { padding: 8px 16px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background-color: var(--light-blue); color: var(--primary-blue); font-weight: bold; border: 1px solid var(--primary-blue); }
        
        select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }

        #statusMessage { margin-top: 15px; font-weight: bold; color: var(--primary-blue); }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header class="header">
        <div class="header-left">
            <h1>數位錯題本儀表板</h1>
            <p>歡迎回來，今天也要努力學習喔！</p>
        </div>
        <div class="header-stats">
            <div class="stat-item"><p>總題數</p><h3>6</h3></div>
            <div class="stat-item"><p>待複習</p><h3>12 題</h3></div>
            <div class="stat-item"><p>AI 準確率</p><h3>98%</h3></div>
        </div>
    </header>

    <main class="main-card">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">☁️</div>
            <h3 id="fileNameDisplay">點擊或拖曳照片至此處</h3>
            <p style="color: #94A3B8; margin-top: 8px; font-size: 0.9rem;">(包含自動壓縮功能)</p>
            <input type="file" id="fileInput" accept="image/jpeg, image/png">
        </div>
        
        <button class="action-btn" id="uploadBtn">模擬照片上傳</button>
        <div id="statusMessage"></div>
    </main>

    <nav class="nav-controls">
        <div class="nav-row">
            <span class="nav-label">切換分頁</span>
            <button class="tab-btn active">上傳新題</button>
            <button class="tab-btn">歷史錯題</button>
            <button class="tab-btn">隨機複習</button>
            <span class="nav-label" style="margin-left: auto; width: auto;">篩選科目</span>
            <select><option>全部</option><option>數學</option><option>化學</option></select>
        </div>
        <div class="nav-row">
            <span class="nav-label">複習範圍</span>
            <button class="tab-btn">近一週</button>
            <button class="tab-btn active">近一個月</button>
            <button class="tab-btn">所有時間</button>
        </div>
    </nav>
</div>

<script>
    // 核心效能：前端圖片壓縮 (保留先前的邏輯)
    async function compressImage(file, maxWidth = 1500, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        if (!blob) return reject(new Error('壓縮失敗'));
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    }, 'image/jpeg', quality);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // UI 互動：選擇檔案後更新文字
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    
    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            fileNameDisplay.textContent = `已選擇：${e.target.files[0].name}`;
            fileNameDisplay.style.color = '#4A90E2';
        }
    });

    // 觸發上傳與壓縮模擬
    document.getElementById('uploadBtn').addEventListener('click', async function() {
        const file = fileInput.files[0];
        const statusMsg = document.getElementById('statusMessage');

        if (!file) { statusMsg.textContent = '⚠️ 請先選擇一張照片！'; statusMsg.style.color = 'red'; return; }

        this.disabled = true;
        this.textContent = '處理中...';
        
        try {
            statusMsg.style.color = '#4A90E2';
            statusMsg.textContent = '1. 正在進行前端圖片壓縮...';
            const compressedFile = await compressImage(file);
            
            const originalSize = (file.size / 1024 / 1024).toFixed(2);
            const newSize = (compressedFile.size / 1024 / 1024).toFixed(2);
            
            await new Promise(r => setTimeout(r, 1000));
            statusMsg.textContent = `✅ 壓縮完成！(${originalSize}MB ➡️ ${newSize}MB)\n2. 準備呼叫後端 API...`;
            
            await new Promise(r => setTimeout(r, 1000));
            statusMsg.textContent = '🎉 模擬完成！隨時可與後端串接。';
            statusMsg.style.color = '#2ECC71';
            
        } catch (error) {
            statusMsg.textContent = `❌ 錯誤：${error.message}`;
            statusMsg.style.color = 'red';
        } finally {
            this.disabled = false;
            this.textContent = '模擬照片上傳';
        }
    });
</script>

</body>
</html>
